stages:
  visualize_data:
    cmd: python src/data_visualization.py
    deps:
    - data/raw/datos_clientes.csv
    - data/raw/datos_resenas.csv
    - src/data_visualization.py
    outs:
    - docs/figures/distribucion_sentimiento.png
    - docs/figures/longitud_texto.png
    - docs/figures/matriz_correlacion_clientes.png
    - docs/figures/matriz_correlacion_resenas.png
    - docs/figures/Mapa_sentimiento_por_categoria_producto.png
    - docs/figures/calificacion_sentimiento.png
    - docs/figures/distribucion_categoria_producto.png
    
  test_data_quality:
    cmd: python -m pytest --html=docs/reporte_calidad_datos.html --self-contained-html test/test_data_quality.py -v
    deps:
    - test/test_data_quality.py
    - data/raw/datos_clientes.csv
    - data/raw/datos_resenas.csv
    outs:
    - docs/reporte_calidad_datos.html

